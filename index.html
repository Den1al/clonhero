<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Clonhero - Roguelike Shooter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ========================================
       DESIGN SYSTEM - CSS Custom Properties
       Inspired by: abeles.dev + GitLab Pajamas
       ======================================== */
    :root {
      /* Primary Colors - GitLab Purple Palette */
      --primary-100: #e8e6f0;
      --primary-200: #c9c4db;
      --primary-300: #a9a0c6;
      --primary-400: #7b6fa6;
      --primary-500: #554488;
      --primary-600: #463875;
      --primary-700: #372c5c;

      /* Accent Colors - GitLab Orange Gradient */
      --accent-100: #fff0e6;
      --accent-200: #ffd9bf;
      --accent-300: #fca326;
      --accent-400: #fc6d26;
      --accent-500: #e24329;
      --accent-600: #c73d24;

      /* Gold/XP Colors - Warm GitLab Orange */
      --gold-100: #fff5e6;
      --gold-200: #ffe4bf;
      --gold-300: #fcd076;
      --gold-400: #fca326;
      --gold-500: #fc6d26;
      --gold-600: #e24329;

      /* Health/Damage Colors */
      --health-high: #108548;
      --health-mid: #fc6d26;
      --health-low: #dd2b0e;
      --health-glow: rgba(16, 133, 72, 0.5);

      /* Background Colors - Deep Space (abeles.dev exact) */
      --bg-deep: #0a0a14;
      --bg-dark: #0e0e1a;
      --bg-medium: #121220;
      --bg-light: #1a1a2c;
      --bg-lighter: #222238;

      /* Particle Colors (abeles.dev exact) */
      --particle-purple-200: rgb(169, 137, 245);
      --particle-teal-200: rgb(111, 218, 201);
      --particle-purple-300: rgb(119, 89, 194);
      --particle-teal-300: rgb(16, 177, 177);
      --glow-cyan: #6fdac9;
      --glow-purple: #a989f5;

      /* Surface Colors (Minimal Glass) */
      --surface-glass: rgba(255, 255, 255, 0.03);
      --surface-glass-hover: rgba(255, 255, 255, 0.06);
      --surface-glass-active: rgba(255, 255, 255, 0.09);
      --surface-border: rgba(255, 255, 255, 0.08);
      --surface-border-hover: rgba(255, 255, 255, 0.15);

      /* Text Colors - High Contrast */
      --text-primary: #fafafa;
      --text-secondary: #8c929d;
      --text-muted: #626772;
      --text-accent: var(--accent-400);

      /* Shadows - Subtle */
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
      --shadow-md: 0 2px 8px rgba(0, 0, 0, 0.5);
      --shadow-lg: 0 4px 16px rgba(0, 0, 0, 0.6);
      --shadow-xl: 0 8px 32px rgba(0, 0, 0, 0.7);
      --shadow-glow-primary: 0 0 20px rgba(85, 68, 136, 0.4);
      --shadow-glow-accent: 0 0 20px rgba(252, 109, 38, 0.4);
      --shadow-glow-gold: 0 0 20px rgba(252, 163, 38, 0.4);

      /* Gradients - GitLab Style */
      --gradient-primary: linear-gradient(135deg, var(--primary-400), var(--primary-600));
      --gradient-accent: linear-gradient(135deg, var(--accent-300), var(--accent-500));
      --gradient-gold: linear-gradient(135deg, var(--gold-300), var(--gold-500));
      --gradient-health: linear-gradient(90deg, var(--health-high), #0d6a3d);
      --gradient-danger: linear-gradient(135deg, #dd2b0e, #ae1800);
      --gradient-success: linear-gradient(135deg, #108548, #0d6a3d);
      --gradient-surface: linear-gradient(135deg, var(--surface-glass), transparent);
      --gradient-gitlab: linear-gradient(135deg, #fca326, #fc6d26, #e24329);

      /* Typography - Terminal Aesthetic */
      --font-display: 'Space Grotesk', sans-serif;
      --font-heading: 'Inter', sans-serif;
      --font-body: 'Inter', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;

      /* Spacing */
      --space-xs: 4px;
      --space-sm: 8px;
      --space-md: 16px;
      --space-lg: 24px;
      --space-xl: 32px;
      --space-2xl: 48px;

      /* Border Radius */
      --radius-sm: 6px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 24px;
      --radius-full: 9999px;

      /* Transitions */
      --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
      --transition-base: 250ms cubic-bezier(0.4, 0, 0.2, 1);
      --transition-slow: 400ms cubic-bezier(0.4, 0, 0.2, 1);
      --transition-bounce: 500ms cubic-bezier(0.68, -0.55, 0.265, 1.55);
    }

    /* ========================================
       BASE STYLES
       ======================================== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg-deep);
      font-family: var(--font-body);
      color: var(--text-primary);
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    #game-container {
      width: 100%;
      height: 100%;
      position: relative;
      background: radial-gradient(ellipse at center, var(--bg-medium) 0%, var(--bg-deep) 100%);
    }

    #game-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* ========================================
       UI OVERLAY
       ======================================== */
    #ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    #ui-overlay > * {
      pointer-events: auto;
    }

    /* ========================================
       HEALTH BAR - Premium Design
       ======================================== */
    #health-container {
      position: absolute;
      top: var(--space-lg);
      left: var(--space-lg);
      display: flex;
      align-items: center;
      gap: var(--space-md);
    }

    #health-icon {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--gradient-danger);
      border-radius: var(--radius-md);
      font-size: 22px;
      box-shadow: var(--shadow-md), 0 0 20px rgba(239, 68, 68, 0.3);
      border: 2px solid rgba(255, 255, 255, 0.2);
      animation: healthPulse 2s ease-in-out infinite;
    }

    @keyframes healthPulse {
      0%, 100% { box-shadow: var(--shadow-md), 0 0 20px rgba(221, 43, 14, 0.3); }
      50% { box-shadow: var(--shadow-md), 0 0 30px rgba(221, 43, 14, 0.5); }
    }

    #health-bar-bg {
      width: 180px;
      height: 24px;
      background: var(--bg-light);
      border-radius: var(--radius-full);
      overflow: hidden;
      border: 2px solid var(--surface-border);
      box-shadow: var(--shadow-md), inset 0 2px 4px rgba(0, 0, 0, 0.5);
      position: relative;
    }

    #health-bar-bg::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 50%;
      background: linear-gradient(to bottom, rgba(255, 255, 255, 0.1), transparent);
      border-radius: var(--radius-full) var(--radius-full) 0 0;
      pointer-events: none;
    }

    #health-bar {
      width: 100%;
      height: 100%;
      background: var(--gradient-health);
      transition: width var(--transition-base);
      position: relative;
      border-radius: var(--radius-full);
    }

    #health-bar::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 4px;
      right: 4px;
      height: 8px;
      background: linear-gradient(to bottom, rgba(255, 255, 255, 0.4), transparent);
      border-radius: var(--radius-full);
    }

    /* ========================================
       XP BAR - Premium Design
       ======================================== */
    #xp-container {
      position: absolute;
      top: var(--space-md);
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-sm);
    }

    #level-display {
      font-family: var(--font-display);
      font-size: 18px;
      font-weight: 700;
      color: var(--gold-400);
      text-shadow: 0 0 20px rgba(252, 163, 38, 0.5);
      letter-spacing: 2px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: var(--space-sm);
    }

    #level-display::before,
    #level-display::after {
      content: '';
      width: 30px;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--gold-400), transparent);
    }

    #xp-bar-bg {
      width: 320px;
      height: 14px;
      background: var(--bg-light);
      border-radius: var(--radius-full);
      overflow: hidden;
      border: 2px solid var(--gold-500);
      box-shadow: var(--shadow-md), var(--shadow-glow-gold), inset 0 2px 4px rgba(0, 0, 0, 0.5);
      position: relative;
    }

    #xp-bar {
      width: 0%;
      height: 100%;
      background: var(--gradient-gold);
      transition: width var(--transition-base);
      position: relative;
      border-radius: var(--radius-full);
    }

    #xp-bar::after {
      content: '';
      position: absolute;
      top: 1px;
      left: 4px;
      right: 4px;
      height: 5px;
      background: linear-gradient(to bottom, rgba(255, 255, 255, 0.5), transparent);
      border-radius: var(--radius-full);
    }

    /* ========================================
       STAGE INFO - Premium Design
       ======================================== */
    #stage-info {
      position: absolute;
      top: var(--space-lg);
      right: var(--space-lg);
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
      text-shadow: var(--shadow-sm);
      background: var(--surface-glass);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: var(--space-sm) var(--space-md);
      border-radius: var(--radius-md);
      border: 1px solid var(--surface-border);
      letter-spacing: 1px;
    }

    /* ========================================
       PAUSE BUTTON - Premium Design
       ======================================== */
    #pause-btn {
      position: absolute;
      top: 70px;
      right: var(--space-lg);
      width: 48px;
      height: 48px;
      background: var(--surface-glass);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 2px solid var(--surface-border);
      border-radius: var(--radius-md);
      color: var(--text-primary);
      font-size: 20px;
      cursor: pointer;
      transition: all var(--transition-fast);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #pause-btn:hover {
      background: var(--surface-glass-hover);
      border-color: var(--surface-border-hover);
      transform: scale(1.05);
    }

    #pause-btn:active {
      transform: scale(0.95);
    }

    /* ========================================
       ABILITY BAR - Premium Design
       ======================================== */
    #ability-bar {
      position: absolute;
      bottom: var(--space-lg);
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: var(--space-sm);
      flex-wrap: wrap;
      justify-content: center;
      max-width: 80%;
      padding: var(--space-sm);
      background: var(--surface-glass);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: var(--radius-lg);
      border: 1px solid var(--surface-border);
    }

    #ability-bar:empty {
      display: none;
    }

    .ability-icon {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, var(--bg-light), var(--bg-medium));
      border: 2px solid var(--primary-500);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      position: relative;
      box-shadow: var(--shadow-md), 0 0 15px rgba(85, 68, 136, 0.2);
      transition: all var(--transition-fast);
    }

    .ability-icon:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-lg), var(--shadow-glow-primary);
    }

    .ability-icon .stack-badge {
      position: absolute;
      bottom: -6px;
      right: -6px;
      background: var(--gradient-danger);
      color: white;
      font-family: var(--font-display);
      font-size: 11px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: var(--radius-full);
      border: 2px solid var(--bg-dark);
      box-shadow: var(--shadow-sm);
    }

    /* ========================================
       VIRTUAL JOYSTICK - Dynamic Touch Position
       ======================================== */
    #joystick-zone {
      position: fixed;
      bottom: 100px;
      left: var(--space-lg);
      width: 150px;
      height: 150px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s ease-out;
      z-index: 200;
    }

    #joystick-base {
      position: absolute;
      width: 100px;
      height: 100px;
      background: radial-gradient(circle, var(--surface-glass-hover) 0%, var(--surface-glass) 100%);
      border: 3px solid var(--surface-border);
      border-radius: 50%;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      box-shadow: var(--shadow-lg), inset 0 0 30px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    #joystick-stick {
      position: absolute;
      width: 44px;
      height: 44px;
      background: var(--gradient-primary);
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      box-shadow: var(--shadow-md), var(--shadow-glow-primary);
      transition: none;
    }

    /* ========================================
       MENU OVERLAY - Deep Space (abeles.dev style)
       ======================================== */
    .menu-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(ellipse at center, rgba(10, 10, 20, 0.85) 0%, rgba(8, 8, 16, 0.92) 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--space-lg);
      z-index: 100;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }

    .menu-overlay.hidden {
      display: none;
    }

    .menu-title {
      font-family: var(--font-display);
      font-size: 64px;
      font-weight: 700;
      background: var(--gradient-gitlab);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: none;
      filter: drop-shadow(0 4px 8px rgba(252, 109, 38, 0.3));
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: var(--space-lg);
      animation: titleFloat 3s ease-in-out infinite;
    }

    @keyframes titleFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .menu-btn {
      padding: var(--space-md) var(--space-2xl);
      font-family: var(--font-display);
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: var(--gradient-primary);
      border: none;
      border-radius: var(--radius-lg);
      color: var(--text-primary);
      cursor: pointer;
      transition: all var(--transition-base);
      box-shadow: var(--shadow-lg), var(--shadow-glow-primary);
      position: relative;
      overflow: hidden;
    }

    .menu-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transition: left 0.5s ease;
    }

    .menu-btn:hover {
      transform: translateY(-4px) scale(1.02);
      box-shadow: var(--shadow-xl), 0 0 40px rgba(85, 68, 136, 0.5);
    }

    .menu-btn:hover::before {
      left: 100%;
    }

    .menu-btn:active {
      transform: translateY(-2px) scale(0.98);
    }

    .menu-btn.secondary {
      background: var(--surface-glass);
      border: 2px solid var(--surface-border);
      box-shadow: var(--shadow-md);
    }

    .menu-btn.secondary:hover {
      background: var(--surface-glass-hover);
      border-color: var(--primary-500);
      box-shadow: var(--shadow-lg), var(--shadow-glow-primary);
    }

    /* ========================================
       SETTINGS MENU
       ======================================== */
    #settings-menu {
      z-index: 160;
      overflow-y: auto;
      padding: var(--space-lg) 0;
    }

    #settings-menu .menu-title {
      flex-shrink: 0;
    }

    .settings-container {
      background: var(--surface-glass);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--surface-border);
      border-radius: var(--radius-xl);
      padding: var(--space-xl);
      margin-bottom: var(--space-lg);
      min-width: 300px;
      max-width: 90%;
      flex-shrink: 0;
    }

    .settings-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: var(--space-md) 0;
      border-bottom: 1px solid var(--surface-border);
    }

    .settings-row:last-child {
      border-bottom: none;
    }

    .settings-label {
      font-family: var(--font-heading);
      font-size: 16px;
      font-weight: 500;
      color: var(--text-primary);
    }

    .toggle-btn {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      padding: var(--space-sm) var(--space-md);
      background: var(--surface-glass);
      border: 2px solid var(--surface-border);
      border-radius: var(--radius-md);
      color: var(--text-secondary);
      font-family: var(--font-display);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition-fast);
      min-width: 90px;
      justify-content: center;
    }

    .toggle-btn:hover {
      border-color: var(--surface-border-hover);
    }

    .toggle-btn.active {
      background: var(--gradient-primary);
      border-color: var(--primary-500);
      color: var(--text-primary);
    }

    .toggle-btn .toggle-icon {
      font-size: 16px;
    }

    .volume-row {
      flex-direction: column;
      align-items: flex-start;
      gap: var(--space-sm);
    }

    .volume-slider {
      width: 100%;
      height: 8px;
      -webkit-appearance: none;
      appearance: none;
      background: var(--bg-light);
      border-radius: var(--radius-full);
      outline: none;
      cursor: pointer;
    }

    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 20px;
      height: 20px;
      background: var(--gradient-primary);
      border-radius: 50%;
      cursor: pointer;
      box-shadow: var(--shadow-md), var(--shadow-glow-primary);
      border: 2px solid rgba(255, 255, 255, 0.3);
    }

    .volume-slider::-moz-range-thumb {
      width: 20px;
      height: 20px;
      background: var(--gradient-primary);
      border-radius: 50%;
      cursor: pointer;
      box-shadow: var(--shadow-md), var(--shadow-glow-primary);
      border: 2px solid rgba(255, 255, 255, 0.3);
    }

    .volume-slider::-webkit-slider-runnable-track {
      background: linear-gradient(to right, var(--primary-500) 0%, var(--primary-500) var(--value, 50%), var(--bg-light) var(--value, 50%), var(--bg-light) 100%);
      border-radius: var(--radius-full);
    }

    /* ========================================
       LEVEL UP SCREEN - Card-based Design
       ======================================== */
    #levelup-screen {
      z-index: 150;
    }

    #levelup-title {
      font-family: var(--font-display);
      font-size: 48px;
      font-weight: 700;
      background: var(--gradient-gitlab);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 30px rgba(252, 163, 38, 0.5));
      letter-spacing: 3px;
      animation: levelUpPulse 1s ease-in-out infinite;
    }

    @keyframes levelUpPulse {
      0%, 100% {
        transform: scale(1);
        filter: drop-shadow(0 0 30px rgba(252, 163, 38, 0.5));
      }
      50% {
        transform: scale(1.05);
        filter: drop-shadow(0 0 50px rgba(252, 163, 38, 0.7));
      }
    }

    #ability-choices {
      display: flex;
      gap: var(--space-lg);
      flex-wrap: wrap;
      justify-content: center;
      max-width: 90%;
      margin-top: var(--space-xl);
    }

    .ability-card {
      width: 220px;
      padding: var(--space-lg);
      background: linear-gradient(135deg, var(--bg-light) 0%, var(--bg-medium) 100%);
      border: 2px solid var(--surface-border);
      border-radius: var(--radius-xl);
      text-align: center;
      cursor: pointer;
      transition: all var(--transition-base);
      position: relative;
      overflow: hidden;
    }

    .ability-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, transparent 0%, rgba(85, 68, 136, 0.12) 100%);
      opacity: 0;
      transition: opacity var(--transition-base);
    }

    .ability-card:hover {
      transform: translateY(-12px) scale(1.02);
      border-color: var(--primary-500);
      box-shadow: var(--shadow-xl), var(--shadow-glow-primary);
    }

    .ability-card:hover::before {
      opacity: 1;
    }

    .ability-card-icon {
      font-size: 56px;
      margin-bottom: var(--space-md);
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.3));
      position: relative;
      z-index: 1;
    }

    .ability-card-name {
      font-family: var(--font-heading);
      font-size: 18px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: var(--space-sm);
      position: relative;
      z-index: 1;
    }

    .ability-card-desc {
      font-family: var(--font-body);
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.5;

    .stats-container p:first-child span {

    /* ========================================
       DAMAGE NUMBERS - Enhanced Animation
       ======================================== */

      position: absolute;
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 700;
      color: var(--text-primary);

      pointer-events: none;
      animation: damageFloat 1s ease-out forwards;
      z-index: 50;
    }

    .damage-number.crit {
      color: var(--gold-400);
      font-size: 32px;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8), 0 0 20px rgba(252, 163, 38, 0.6);
      animation: critFloat 1s ease-out forwards;
    }

    @keyframes damageFloat {
      0% {
        opacity: 1;
        transform: translateY(0) scale(1.2);
      }
      20% {
        transform: translateY(-10px) scale(1);
      }
      100% {
        opacity: 0;
        transform: translateY(-50px) scale(0.8);
      }
    }

    @keyframes critFloat {
      0% {
        opacity: 1;
        transform: translateY(0) scale(1.5) rotate(-5deg);
      }
      20% {
        transform: translateY(-15px) scale(1.2) rotate(5deg);
      }
      100% {
        opacity: 0;
        transform: translateY(-60px) scale(0.8) rotate(0deg);
      }
    }

    /* XP Collected Animation */
    @keyframes xpCollectedAnim {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.5);
      }
      20% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.3);
      }
      80% {
        opacity: 1;
        transform: translate(-50%, -30%) scale(1);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -100%) scale(0.8);
      }
    }

    /* ========================================
       WAVE ANNOUNCEMENT - Dramatic Entry
       ======================================== */
    #wave-announcement {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);

      }
      15% {

      25% {

      75% {

      }
      100% {

  <script type="module" src="/src/main.js"></script>

  <!-- Particle Background Animation (abeles.dev style) -->
  <script>
    (function() {
      const canvas = document.getElementById('particle-bg');
      const ctx = canvas.getContext('2d');

      // Configuration (matching abeles.dev)
      const PARTICLE_COUNT = 60;
      const CONNECTION_DISTANCE = 180;
      const MOUSE_RADIUS = 100;
      const DAMPING = 0.99;

      // Colors from abeles.dev
      const colors = [
        { r: 169, g: 137, b: 245 }, // purple-200
        { r: 111, g: 218, b: 201 }, // teal-200
        { r: 119, g: 89, b: 194 },  // purple-300
        { r: 16, g: 177, b: 177 }   // teal-300
      ];

      let particles = [];
      let mouse = { x: null, y: null };
      let animationId = null;

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }

      function createParticle() {
        const color = colors[Math.floor(Math.random() * colors.length)];
        return {
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          vx: (Math.random() - 0.5) * 0.4,
          vy: (Math.random() - 0.5) * 0.4,
          size: Math.random() * 2.5 + 1.5,
          opacity: Math.random() * 0.4 + 0.5,
          color: color
        };
      }

      function init() {
        resize();
        particles = [];
        for (let i = 0; i < PARTICLE_COUNT; i++) {
          particles.push(createParticle());
        }
      }

      function update() {
        particles.forEach(p => {
          // Apply velocity
          p.x += p.vx;
          p.y += p.vy;

          // Apply damping
          p.vx *= DAMPING;
          p.vy *= DAMPING;

          // Bounce off edges
          if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
          if (p.y < 0 || p.y > canvas.height) p.vy *= -1;

          // Keep in bounds
          p.x = Math.max(0, Math.min(canvas.width, p.x));
          p.y = Math.max(0, Math.min(canvas.height, p.y));

          // Mouse repulsion
          if (mouse.x !== null && mouse.y !== null) {
            const dx = p.x - mouse.x;
            const dy = p.y - mouse.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < MOUSE_RADIUS && dist > 0) {
              const force = (MOUSE_RADIUS - dist) / MOUSE_RADIUS * 0.02;
              p.vx += (dx / dist) * force;
              p.vy += (dy / dist) * force;
            }
          }
        });
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Draw connections
        for (let i = 0; i < particles.length; i++) {
          for (let j = i + 1; j < particles.length; j++) {
            const p1 = particles[i];
            const p2 = particles[j];
            const dx = p1.x - p2.x;
            const dy = p1.y - p2.y;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist < CONNECTION_DISTANCE) {
              const opacity = (1 - dist / CONNECTION_DISTANCE) * 0.15;
              const gradient = ctx.createLinearGradient(p1.x, p1.y, p2.x, p2.y);
              gradient.addColorStop(0, `rgba(${p1.color.r}, ${p1.color.g}, ${p1.color.b}, ${opacity})`);
              gradient.addColorStop(1, `rgba(${p2.color.r}, ${p2.color.g}, ${p2.color.b}, ${opacity})`);

              ctx.beginPath();
              ctx.strokeStyle = gradient;
              ctx.lineWidth = 1;
              ctx.moveTo(p1.x, p1.y);
              ctx.lineTo(p2.x, p2.y);
              ctx.stroke();
            }
          }
        }

        // Draw particles
        particles.forEach(p => {
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(${p.color.r}, ${p.color.g}, ${p.color.b}, ${p.opacity})`;
          ctx.fill();
        });
      }

      function animate() {
        update();
        draw();
        animationId = requestAnimationFrame(animate);
      }

      // Event listeners
      window.addEventListener('resize', () => {
        resize();
      });

      window.addEventListener('mousemove', (e) => {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
      });

      window.addEventListener('mouseleave', () => {
        mouse.x = null;
        mouse.y = null;
      });

      // Start animation
      init();
      animate();
    })();
  </script>
</body>
</html>
