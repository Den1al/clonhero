<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Clonhero - Roguelike Shooter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&family=Exo+2:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ========================================
       DESIGN SYSTEM - CSS Custom Properties
       ======================================== */
    :root {
      /* Primary Colors - Vibrant Purple/Blue Gaming Palette */
      --primary-100: #e0e7ff;
      --primary-200: #c7d2fe;
      --primary-300: #a5b4fc;
      --primary-400: #818cf8;
      --primary-500: #6366f1;
      --primary-600: #4f46e5;
      --primary-700: #4338ca;

      /* Accent Colors - Electric Cyan */
      --accent-100: #cffafe;
      --accent-200: #a5f3fc;
      --accent-300: #67e8f9;
      --accent-400: #22d3ee;
      --accent-500: #06b6d4;
      --accent-600: #0891b2;

      /* Gold/XP Colors */
      --gold-100: #fef3c7;
      --gold-200: #fde68a;
      --gold-300: #fcd34d;
      --gold-400: #fbbf24;
      --gold-500: #f59e0b;
      --gold-600: #d97706;

      /* Health/Damage Colors */
      --health-high: #10b981;
      --health-mid: #f59e0b;
      --health-low: #ef4444;
      --health-glow: rgba(16, 185, 129, 0.5);

      /* Background Colors */
      --bg-deep: #0a0a0f;
      --bg-dark: #0f0f1a;
      --bg-medium: #1a1a2e;
      --bg-light: #25253d;
      --bg-lighter: #2d2d4a;

      /* Surface Colors (Glassmorphism) */
      --surface-glass: rgba(255, 255, 255, 0.05);
      --surface-glass-hover: rgba(255, 255, 255, 0.1);
      --surface-glass-active: rgba(255, 255, 255, 0.15);
      --surface-border: rgba(255, 255, 255, 0.1);
      --surface-border-hover: rgba(255, 255, 255, 0.2);

      /* Text Colors */
      --text-primary: #ffffff;
      --text-secondary: #a1a1aa;
      --text-muted: #71717a;
      --text-accent: var(--accent-400);

      /* Shadows */
      --shadow-sm: 0 2px 4px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.4);
      --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.5);
      --shadow-xl: 0 16px 48px rgba(0, 0, 0, 0.6);
      --shadow-glow-primary: 0 0 30px rgba(99, 102, 241, 0.4);
      --shadow-glow-accent: 0 0 30px rgba(34, 211, 238, 0.4);
      --shadow-glow-gold: 0 0 30px rgba(251, 191, 36, 0.4);

      /* Gradients */
      --gradient-primary: linear-gradient(135deg, var(--primary-500), var(--primary-700));
      --gradient-accent: linear-gradient(135deg, var(--accent-400), var(--accent-600));
      --gradient-gold: linear-gradient(135deg, var(--gold-400), var(--gold-600));
      --gradient-health: linear-gradient(90deg, var(--health-high), #059669);
      --gradient-danger: linear-gradient(135deg, #ef4444, #dc2626);
      --gradient-success: linear-gradient(135deg, #10b981, #059669);
      --gradient-surface: linear-gradient(135deg, var(--surface-glass), transparent);

      /* Typography */
      --font-display: 'Orbitron', sans-serif;
      --font-heading: 'Exo 2', sans-serif;
      --font-body: 'Rajdhani', sans-serif;

      /* Spacing */
      --space-xs: 4px;
      --space-sm: 8px;
      --space-md: 16px;
      --space-lg: 24px;
      --space-xl: 32px;
      --space-2xl: 48px;

      /* Border Radius */
      --radius-sm: 6px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 24px;
      --radius-full: 9999px;

      /* Transitions */
      --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
      --transition-base: 250ms cubic-bezier(0.4, 0, 0.2, 1);
      --transition-slow: 400ms cubic-bezier(0.4, 0, 0.2, 1);
      --transition-bounce: 500ms cubic-bezier(0.68, -0.55, 0.265, 1.55);
    }

    /* ========================================
       BASE STYLES
       ======================================== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg-deep);
      font-family: var(--font-body);
      color: var(--text-primary);
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    #game-container {
      width: 100%;
      height: 100%;
      position: relative;
      background: radial-gradient(ellipse at center, var(--bg-medium) 0%, var(--bg-deep) 100%);
    }

    #game-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* ========================================
       UI OVERLAY
       ======================================== */
    #ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    #ui-overlay > * {
      pointer-events: auto;
    }

    /* ========================================
       HEALTH BAR - Premium Design
       ======================================== */
    #health-container {
      position: absolute;
      top: var(--space-lg);
      left: var(--space-lg);
      display: flex;
      align-items: center;
      gap: var(--space-md);
    }

    #health-icon {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--gradient-danger);
      border-radius: var(--radius-md);
      font-size: 22px;
      box-shadow: var(--shadow-md), 0 0 20px rgba(239, 68, 68, 0.3);
      border: 2px solid rgba(255, 255, 255, 0.2);
      animation: healthPulse 2s ease-in-out infinite;
    }

    @keyframes healthPulse {
      0%, 100% { box-shadow: var(--shadow-md), 0 0 20px rgba(239, 68, 68, 0.3); }
      50% { box-shadow: var(--shadow-md), 0 0 30px rgba(239, 68, 68, 0.5); }
    }

    #health-bar-bg {
      width: 180px;
      height: 24px;
      background: var(--bg-light);
      border-radius: var(--radius-full);
      overflow: hidden;
      border: 2px solid var(--surface-border);
      box-shadow: var(--shadow-md), inset 0 2px 4px rgba(0, 0, 0, 0.5);
      position: relative;
    }

    #health-bar-bg::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 50%;
      background: linear-gradient(to bottom, rgba(255, 255, 255, 0.1), transparent);
      border-radius: var(--radius-full) var(--radius-full) 0 0;
      pointer-events: none;
    }

    #health-bar {
      width: 100%;
      height: 100%;
      background: var(--gradient-health);
      transition: width var(--transition-base);
      position: relative;
      border-radius: var(--radius-full);
    }

    #health-bar::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 4px;
      right: 4px;
      height: 8px;
      background: linear-gradient(to bottom, rgba(255, 255, 255, 0.4), transparent);
      border-radius: var(--radius-full);
    }

    /* ========================================
       XP BAR - Premium Design
       ======================================== */
    #xp-container {
      position: absolute;
      top: var(--space-md);
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-sm);
    }

    #level-display {
      font-family: var(--font-display);
      font-size: 18px;
      font-weight: 700;
      color: var(--gold-400);
      text-shadow: 0 0 20px rgba(251, 191, 36, 0.5);
      letter-spacing: 2px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: var(--space-sm);
    }

    #level-display::before,
    #level-display::after {
      content: '';
      width: 30px;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--gold-400), transparent);
    }

    #xp-bar-bg {
      width: 320px;
      height: 14px;
      background: var(--bg-light);
      border-radius: var(--radius-full);
      overflow: hidden;
      border: 2px solid var(--gold-500);
      box-shadow: var(--shadow-md), var(--shadow-glow-gold), inset 0 2px 4px rgba(0, 0, 0, 0.5);
      position: relative;
    }

    #xp-bar {
      width: 0%;
      height: 100%;
      background: var(--gradient-gold);
      transition: width var(--transition-base);
      position: relative;
      border-radius: var(--radius-full);
    }

    #xp-bar::after {
      content: '';
      position: absolute;
      top: 1px;
      left: 4px;
      right: 4px;
      height: 5px;
      background: linear-gradient(to bottom, rgba(255, 255, 255, 0.5), transparent);
      border-radius: var(--radius-full);
    }

    /* ========================================
       STAGE INFO - Premium Design
       ======================================== */
    #stage-info {
      position: absolute;
      top: var(--space-lg);
      right: var(--space-lg);
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
      text-shadow: var(--shadow-sm);
      background: var(--surface-glass);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: var(--space-sm) var(--space-md);
      border-radius: var(--radius-md);
      border: 1px solid var(--surface-border);
      letter-spacing: 1px;
    }

    /* ========================================
       PAUSE BUTTON - Premium Design
       ======================================== */
    #pause-btn {
      position: absolute;
      top: 70px;
      right: var(--space-lg);
      width: 48px;
      height: 48px;
      background: var(--surface-glass);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 2px solid var(--surface-border);
      border-radius: var(--radius-md);
      color: var(--text-primary);
      font-size: 20px;
      cursor: pointer;
      transition: all var(--transition-fast);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #pause-btn:hover {
      background: var(--surface-glass-hover);
      border-color: var(--surface-border-hover);
      transform: scale(1.05);
    }

    #pause-btn:active {
      transform: scale(0.95);
    }

    /* ========================================
       ABILITY BAR - Premium Design
       ======================================== */
    #ability-bar {
      position: absolute;
      bottom: var(--space-lg);
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: var(--space-sm);
      flex-wrap: wrap;
      justify-content: center;
      max-width: 80%;
      padding: var(--space-sm);
      background: var(--surface-glass);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: var(--radius-lg);
      border: 1px solid var(--surface-border);
    }

    #ability-bar:empty {
      display: none;
    }

    .ability-icon {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, var(--bg-light), var(--bg-medium));
      border: 2px solid var(--primary-500);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      position: relative;
      box-shadow: var(--shadow-md), 0 0 15px rgba(99, 102, 241, 0.2);
      transition: all var(--transition-fast);
    }

    .ability-icon:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-lg), var(--shadow-glow-primary);
    }

    .ability-icon .stack-badge {
      position: absolute;
      bottom: -6px;
      right: -6px;
      background: var(--gradient-danger);
      color: white;
      font-family: var(--font-display);
      font-size: 11px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: var(--radius-full);
      border: 2px solid var(--bg-dark);
      box-shadow: var(--shadow-sm);
    }

    /* ========================================
       VIRTUAL JOYSTICK - Premium Design
       ======================================== */
    #joystick-zone {
      position: absolute;
      bottom: 100px;
      left: var(--space-lg);
      width: 150px;
      height: 150px;
      pointer-events: auto;
    }

    #joystick-base {
      position: absolute;
      width: 130px;
      height: 130px;
      background: radial-gradient(circle, var(--surface-glass-hover) 0%, var(--surface-glass) 100%);
      border: 3px solid var(--surface-border);
      border-radius: 50%;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      box-shadow: var(--shadow-lg), inset 0 0 30px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    #joystick-stick {
      position: absolute;
      width: 56px;
      height: 56px;
      background: var(--gradient-primary);
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      box-shadow: var(--shadow-md), var(--shadow-glow-primary);
      transition: none;
    }

    /* ========================================
       MENU OVERLAY - Glassmorphism
       ======================================== */
    .menu-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(ellipse at center, rgba(15, 15, 26, 0.95) 0%, rgba(10, 10, 15, 0.98) 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--space-lg);
      z-index: 100;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .menu-overlay.hidden {
      display: none;
    }

    .menu-title {
      font-family: var(--font-display);
      font-size: 64px;
      font-weight: 900;
      background: var(--gradient-gold);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: none;
      filter: drop-shadow(0 4px 8px rgba(251, 191, 36, 0.3));
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: var(--space-lg);
      animation: titleFloat 3s ease-in-out infinite;
    }

    @keyframes titleFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .menu-btn {
      padding: var(--space-md) var(--space-2xl);
      font-family: var(--font-display);
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: var(--gradient-primary);
      border: none;
      border-radius: var(--radius-lg);
      color: var(--text-primary);
      cursor: pointer;
      transition: all var(--transition-base);
      box-shadow: var(--shadow-lg), var(--shadow-glow-primary);
      position: relative;
      overflow: hidden;
    }

    .menu-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transition: left 0.5s ease;
    }

    .menu-btn:hover {
      transform: translateY(-4px) scale(1.02);
      box-shadow: var(--shadow-xl), 0 0 40px rgba(99, 102, 241, 0.5);
    }

    .menu-btn:hover::before {
      left: 100%;
    }

    .menu-btn:active {
      transform: translateY(-2px) scale(0.98);
    }

    .menu-btn.secondary {
      background: var(--surface-glass);
      border: 2px solid var(--surface-border);
      box-shadow: var(--shadow-md);
    }

    .menu-btn.secondary:hover {
      background: var(--surface-glass-hover);
      border-color: var(--primary-500);
      box-shadow: var(--shadow-lg), var(--shadow-glow-primary);
    }

    /* ========================================
       LEVEL UP SCREEN - Card-based Design
       ======================================== */
    #levelup-screen {
      z-index: 150;
    }

    #levelup-title {
      font-family: var(--font-display);
      font-size: 48px;
      font-weight: 900;
      background: var(--gradient-gold);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 30px rgba(251, 191, 36, 0.5));
      letter-spacing: 4px;
      animation: levelUpPulse 1s ease-in-out infinite;
    }

    @keyframes levelUpPulse {
      0%, 100% {
        transform: scale(1);
        filter: drop-shadow(0 0 30px rgba(251, 191, 36, 0.5));
      }
      50% {
        transform: scale(1.05);
        filter: drop-shadow(0 0 50px rgba(251, 191, 36, 0.7));
      }
    }

    #ability-choices {
      display: flex;
      gap: var(--space-lg);
      flex-wrap: wrap;
      justify-content: center;
      max-width: 90%;
      margin-top: var(--space-xl);
    }

    .ability-card {
      width: 220px;
      padding: var(--space-lg);
      background: linear-gradient(135deg, var(--bg-light) 0%, var(--bg-medium) 100%);
      border: 2px solid var(--surface-border);
      border-radius: var(--radius-xl);
      text-align: center;
      cursor: pointer;
      transition: all var(--transition-base);
      position: relative;
      overflow: hidden;
    }

    .ability-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, transparent 0%, rgba(99, 102, 241, 0.1) 100%);
      opacity: 0;
      transition: opacity var(--transition-base);
    }

    .ability-card:hover {
      transform: translateY(-12px) scale(1.02);
      border-color: var(--primary-500);
      box-shadow: var(--shadow-xl), var(--shadow-glow-primary);
    }

    .ability-card:hover::before {
      opacity: 1;
    }

    .ability-card-icon {
      font-size: 56px;
      margin-bottom: var(--space-md);
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.3));
      position: relative;
      z-index: 1;
    }

    .ability-card-name {
      font-family: var(--font-heading);
      font-size: 18px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: var(--space-sm);
      position: relative;
      z-index: 1;
    }

    .ability-card-desc {
      font-family: var(--font-body);
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.5;
      position: relative;
      z-index: 1;
    }

    /* ========================================
       GAME OVER / VICTORY SCREENS
       ======================================== */
    #gameover-screen .menu-title {
      font-size: 72px;
      background: var(--gradient-danger);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 30px rgba(239, 68, 68, 0.5));
      animation: gameOverShake 0.5s ease-in-out;
    }

    @keyframes gameOverShake {
      0%, 100% { transform: translateX(0); }
      10%, 30%, 50%, 70%, 90% { transform: translateX(-10px); }
      20%, 40%, 60%, 80% { transform: translateX(10px); }
    }

    #victory-screen .menu-title {
      font-size: 72px;
      background: var(--gradient-success);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 30px rgba(16, 185, 129, 0.5));
      animation: victoryBounce 0.6s ease-out;
    }

    @keyframes victoryBounce {
      0% { transform: scale(0); opacity: 0; }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); opacity: 1; }
    }

    .stats-container {
      background: var(--surface-glass);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--surface-border);
      border-radius: var(--radius-xl);
      padding: var(--space-xl);
      margin-bottom: var(--space-lg);
      min-width: 280px;
    }

    .stats-container p {
      font-family: var(--font-heading);
      font-size: 20px;
      color: var(--text-secondary);
      margin: var(--space-sm) 0;
      display: flex;
      justify-content: space-between;
      gap: var(--space-xl);
    }

    .stats-container p span {
      font-family: var(--font-display);
      font-weight: 700;
      color: var(--text-primary);
    }

    .stats-container p:first-child span {
      color: var(--gold-400);
    }

    /* ========================================
       DAMAGE NUMBERS - Enhanced Animation
       ======================================== */
    .damage-number {
      position: absolute;
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 700;
      color: var(--text-primary);
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8), 0 0 10px rgba(255, 255, 255, 0.3);
      pointer-events: none;
      animation: damageFloat 1s ease-out forwards;
      z-index: 50;
    }

    .damage-number.crit {
      color: var(--gold-400);
      font-size: 32px;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8), 0 0 20px rgba(251, 191, 36, 0.6);
      animation: critFloat 1s ease-out forwards;
    }

    @keyframes damageFloat {
      0% {
        opacity: 1;
        transform: translateY(0) scale(1.2);
      }
      20% {
        transform: translateY(-10px) scale(1);
      }
      100% {
        opacity: 0;
        transform: translateY(-50px) scale(0.8);
      }
    }

    @keyframes critFloat {
      0% {
        opacity: 1;
        transform: translateY(0) scale(1.5) rotate(-5deg);
      }
      20% {
        transform: translateY(-15px) scale(1.2) rotate(5deg);
      }
      100% {
        opacity: 0;
        transform: translateY(-60px) scale(0.8) rotate(0deg);
      }
    }

    /* XP Collected Animation */
    @keyframes xpCollectedAnim {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.5);
      }
      20% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.3);
      }
      80% {
        opacity: 1;
        transform: translate(-50%, -30%) scale(1);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -100%) scale(0.8);
      }
    }

    /* ========================================
       WAVE ANNOUNCEMENT - Dramatic Entry
       ======================================== */
    #wave-announcement {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: var(--font-display);
      font-size: 48px;
      font-weight: 900;
      color: var(--text-primary);
      text-shadow: 0 4px 8px rgba(0, 0, 0, 0.8);
      opacity: 0;
      pointer-events: none;
      z-index: 50;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    #wave-announcement.show {
      animation: waveAnnounce 2.5s ease-out forwards;
    }

    @keyframes waveAnnounce {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.3) rotate(-10deg);
        filter: blur(10px);
      }
      15% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.2) rotate(2deg);
        filter: blur(0);
      }
      25% {
        transform: translate(-50%, -50%) scale(1) rotate(0deg);
      }
      75% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.9);
        filter: blur(5px);
      }
    }

    /* ========================================
       MOBILE ADJUSTMENTS
       ======================================== */
    @media (max-width: 768px) {
      :root {
        --space-lg: 16px;
        --space-xl: 24px;
      }

      #health-bar-bg {
        width: 120px;
        height: 20px;
      }

      #health-icon {
        width: 36px;
        height: 36px;
        font-size: 18px;
      }

      #xp-bar-bg {
        width: 220px;
        height: 12px;
      }

      #level-display {
        font-size: 14px;
      }

      #level-display::before,
      #level-display::after {
        width: 20px;
      }

      .menu-title {
        font-size: 40px;
        letter-spacing: 2px;
      }

      .menu-btn {
        padding: var(--space-sm) var(--space-xl);
        font-size: 16px;
      }

      #levelup-title {
        font-size: 32px;
      }

      .ability-card {
        width: 160px;
        padding: var(--space-md);
      }

      .ability-card-icon {
        font-size: 40px;
      }

      .ability-card-name {
        font-size: 14px;
      }

      .ability-card-desc {
        font-size: 12px;
      }

      #stage-info {
        font-size: 12px;
        padding: var(--space-xs) var(--space-sm);
      }

      #gameover-screen .menu-title,
      #victory-screen .menu-title {
        font-size: 48px;
      }

      .stats-container {
        padding: var(--space-lg);
        min-width: 240px;
      }

      .stats-container p {
        font-size: 16px;
      }

      #wave-announcement {
        font-size: 32px;
      }

      .ability-icon {
        width: 40px;
        height: 40px;
        font-size: 20px;
      }
    }

    @media (max-width: 480px) {
      .menu-title {
        font-size: 32px;
      }

      #ability-choices {
        gap: var(--space-md);
      }

      .ability-card {
        width: 140px;
        padding: var(--space-sm);
      }

      .ability-card-icon {
        font-size: 32px;
        margin-bottom: var(--space-sm);
      }

      .ability-card-name {
        font-size: 12px;
      }

      .ability-card-desc {
        font-size: 11px;
      }
    }

    /* ========================================
       DECORATIVE ELEMENTS
       ======================================== */
    .menu-overlay::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background:
        radial-gradient(circle at 20% 20%, rgba(99, 102, 241, 0.1) 0%, transparent 40%),
        radial-gradient(circle at 80% 80%, rgba(34, 211, 238, 0.1) 0%, transparent 40%),
        radial-gradient(circle at 50% 50%, rgba(251, 191, 36, 0.05) 0%, transparent 50%);
      pointer-events: none;
    }

    /* Scanline effect for retro-futuristic feel */
    .menu-overlay::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0, 0, 0, 0.03) 2px,
        rgba(0, 0, 0, 0.03) 4px
      );
      pointer-events: none;
    }

    /* ========================================
       UTILITY CLASSES
       ======================================== */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
